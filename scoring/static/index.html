<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMR Scoring</title>
<style>
/* ── Reset & Base ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px; line-height: 1.5; color: #1a1a1a; background: #f5f6f8;
  padding: 24px; max-width: 960px; margin: 0 auto;
}
h1 { font-size: 1.5rem; margin-bottom: 4px; }
h2 { font-size: 1.15rem; margin: 20px 0 8px; border-bottom: 2px solid #ddd; padding-bottom: 4px; }
h3 { font-size: 1rem; margin: 12px 0 6px; }
button {
  cursor: pointer; padding: 6px 16px; border: 1px solid #999; border-radius: 4px;
  background: #fff; font-size: 14px;
}
button:hover { background: #e8e8e8; }
button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
button.primary:hover { background: #1d4ed8; }
button.danger { background: #dc2626; color: #fff; border-color: #dc2626; }
button.danger:hover { background: #b91c1c; }
select, input[type="text"], input[type="number"] {
  padding: 4px 8px; border: 1px solid #bbb; border-radius: 4px; font-size: 14px;
}
label { cursor: pointer; }
.mono { font-family: "Cascadia Code", "Fira Code", Consolas, monospace; font-size: 13px; }

/* ── Layout ─────────────────────────────────────────────────────── */
.card {
  background: #fff; border: 1px solid #ddd; border-radius: 8px;
  padding: 16px 20px; margin-bottom: 16px;
}
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row > label { min-width: 140px; }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 10px;
  font-size: 12px; font-weight: 600;
}
.badge-blue { background: #dbeafe; color: #1e40af; }
.badge-amber { background: #fef3c7; color: #92400e; }
.badge-red { background: #fee2e2; color: #991b1b; }
.badge-green { background: #d1fae5; color: #065f46; }
.info { color: #555; font-size: 13px; margin-top: 2px; }
.warning { color: #b45309; font-size: 13px; }
.error { color: #dc2626; font-size: 13px; }
#status-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #1e293b; color: #e2e8f0; padding: 6px 20px;
  font-size: 13px; display: none; z-index: 100;
}

/* ── Tabs ───────────────────────────────────────────────────────── */
.tab-bar { display: flex; gap: 2px; border-bottom: 2px solid #ddd; margin-bottom: 12px; }
.tab-btn {
  padding: 6px 16px; border: 1px solid transparent; border-bottom: none;
  border-radius: 6px 6px 0 0; background: #eee; font-size: 14px; cursor: pointer;
}
.tab-btn.active { background: #fff; border-color: #ddd; font-weight: 600; position: relative; top: 2px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Key Grid ───────────────────────────────────────────────────── */
.key-grid { width: 100%; border-collapse: collapse; margin-top: 8px; }
.key-grid th, .key-grid td {
  padding: 3px 6px; text-align: center; border: 1px solid #e5e7eb; font-size: 13px;
}
.key-grid th { background: #f3f4f6; font-weight: 600; position: sticky; top: 0; }
.key-grid td label { display: block; }
.key-grid input[type="radio"] { margin: 0; }
.key-grid-wrap { max-height: 480px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; }

/* ── Preview Table ──────────────────────────────────────────────── */
.preview-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.preview-table th, .preview-table td { padding: 4px 8px; border: 1px solid #e5e7eb; text-align: left; }
.preview-table th { background: #f3f4f6; position: sticky; top: 0; }
.preview-table tr:nth-child(even) { background: #fafafa; }
.preview-wrap { max-height: 400px; overflow: auto; border: 1px solid #ddd; border-radius: 4px; }

/* ── Radio-group (policy) ───────────────────────────────────────── */
.policy-group { display: flex; flex-direction: column; gap: 4px; }
.policy-option { display: flex; align-items: baseline; gap: 6px; }
.policy-option .desc { color: #555; font-size: 13px; }
</style>
</head>
<body>

<h1>OMR Scoring</h1>
<p class="info">Stage 2 — score <code>results.csv</code> with answer keys, a marking scheme, and a multi-mark policy.</p>

<!-- ════════════════ Step 1: Summary ════════════════ -->
<div class="card" id="step1">
  <h2>① Results Summary</h2>
  <div id="summary-content"><p class="info">Loading…</p></div>
  <div style="margin-top:8px"><button onclick="loadSummary()">↻ Reload</button></div>
</div>

<!-- ════════════════ Step 2: Scheme + Policy ════════════════ -->
<div class="card" id="step2">
  <h2>② Marking Scheme &amp; Multi-Mark Policy</h2>
  <div class="row" style="margin-bottom:8px">
    <label for="scheme-preset">Preset:</label>
    <select id="scheme-preset" onchange="applyPreset()">
      <option value="4,-1,0" selected>+4 / −1 / 0  (standard)</option>
      <option value="1,0,0">+1 / 0 / 0  (simple)</option>
      <option value="3,-1,0">+3 / −1 / 0</option>
      <option value="2,-0.5,0">+2 / −0.5 / 0</option>
      <option value="custom">Custom…</option>
    </select>
  </div>
  <div class="row" id="scheme-fields">
    <label>Correct: <input type="text" id="mc" value="4" size="5" class="mono"></label>
    <label>Wrong: <input type="text" id="mw" value="-1" size="5" class="mono"></label>
    <label>Unattempted: <input type="text" id="mu" value="0" size="5" class="mono"></label>
  </div>

  <h3>Multi-Mark Policy</h3>
  <div class="policy-group">
    <label class="policy-option">
      <input type="radio" name="multi" value="zero" checked>
      <strong>zero</strong> <span class="desc">— treated as unattempted (gets unattempted marks). <span class="badge badge-green">Default</span></span>
    </label>
    <label class="policy-option">
      <input type="radio" name="multi" value="wrong">
      <strong>wrong</strong> <span class="desc">— treated as wrong (gets wrong marks).</span>
    </label>
    <label class="policy-option">
      <input type="radio" name="multi" value="credit_if_contains">
      <strong>credit_if_contains</strong> <span class="desc">— correct if the key letter is among the marked letters, otherwise wrong (generous).</span>
    </label>
    <label class="policy-option">
      <input type="radio" name="multi" value="hold">
      <strong>hold</strong> <span class="desc">— 0 marks; the sheet is flagged REVIEW for human checking.</span>
    </label>
  </div>

  <div class="row" style="margin-top:10px">
    <label for="options-str">Options:</label>
    <input type="text" id="options-str" value="ABCD" size="8" class="mono"
           title="Allowed option letters, e.g. ABCD or ABCDE">
    <label style="margin-left:12px">
      <input type="checkbox" id="per-question"> Include per-question marks
    </label>
  </div>
</div>

<!-- ════════════════ Step 3: Answer Keys ════════════════ -->
<div class="card" id="step3">
  <h2>③ Answer Keys</h2>
  <div id="key-tabs-bar" class="tab-bar"></div>
  <div id="key-tabs-content"></div>
  <div class="row" style="margin-top:8px; gap:6px">
    <button onclick="addSetTab()">+ Add Set</button>
  </div>
</div>

<!-- ════════════════ Step 4: Actions ════════════════ -->
<div class="card" id="step4">
  <h2>④ Save / Load / Score</h2>
  <div class="row" style="flex-wrap:wrap; gap:8px">
    <label for="key-name">Key name:</label>
    <input type="text" id="key-name" value="" placeholder="quiz1" size="16" class="mono">
    <button onclick="saveKeys()">💾 Save Keys</button>
    <select id="key-load-list" style="min-width:120px"><option value="">— load —</option></select>
    <button onclick="loadKeys()">📂 Load Keys</button>
    <button onclick="refreshKeyList()">↻</button>
  </div>
  <div style="margin-top:12px" class="row">
    <button class="primary" onclick="doPreview()">👁 Preview (first 20 rows)</button>
    <button class="danger" onclick="doScore()">✏️ Write score.csv</button>
  </div>
  <div id="preview-area" style="margin-top:12px"></div>
</div>

<div id="status-bar"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════════════════ */
let G = {
  numQ: 0,
  qColumns: [],
  setsInData: {},
  activeSets: [],       // set letters with tabs
  keys: {},             // { "A": ["B","","C",...], ... }
  activeTab: null,
};

/* ═══════════════════════════════════════════════════════════════════
   API helpers
   ═══════════════════════════════════════════════════════════════════ */
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function status(msg, ms) {
  const el = document.getElementById("status-bar");
  el.textContent = msg; el.style.display = "block";
  if (ms) setTimeout(() => { el.style.display = "none"; }, ms);
}

/* ═══════════════════════════════════════════════════════════════════
   Step 1: Summary
   ═══════════════════════════════════════════════════════════════════ */
async function loadSummary() {
  const el = document.getElementById("summary-content");
  try {
    const d = await api("GET", "/api/summary");
    G.numQ = d.questions;
    G.qColumns = d.q_columns;
    G.setsInData = d.sets;

    let setHtml = Object.entries(d.sets)
      .map(([s, c]) => {
        const lbl = s || "(blank)";
        const cls = s ? "badge-blue" : "badge-red";
        return `<span class="badge ${cls}">${lbl}: ${c}</span>`;
      }).join(" ");

    el.innerHTML = `
      <div class="row">
        <span><strong>${d.row_count}</strong> rows</span>
        <span><strong>${d.questions}</strong> questions</span>
        <span>${setHtml}</span>
        <span class="badge ${d.flagged ? 'badge-amber' : 'badge-green'}">${d.flagged} flagged</span>
      </div>
      <p class="info mono" style="margin-top:4px">${d.path}</p>`;

    // Auto-create tabs for sets found (non-blank)
    const dataSets = Object.keys(d.sets).filter(s => s && s.trim());
    dataSets.sort();
    // Only add tabs we don't already have
    for (const s of dataSets) {
      if (!G.activeSets.includes(s)) addSetTab(s);
    }
    // Warn about sets with no tab
    checkSetWarnings();
  } catch (e) {
    el.innerHTML = `<p class="error">Error: ${esc(e.message)}</p>`;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Step 2: Scheme
   ═══════════════════════════════════════════════════════════════════ */
function applyPreset() {
  const v = document.getElementById("scheme-preset").value;
  if (v === "custom") return;
  const [c, w, u] = v.split(",");
  document.getElementById("mc").value = c;
  document.getElementById("mw").value = w;
  document.getElementById("mu").value = u;
}

function getScheme() {
  return {
    correct: document.getElementById("mc").value.trim(),
    wrong: document.getElementById("mw").value.trim(),
    unattempted: document.getElementById("mu").value.trim(),
  };
}

function getMultiPolicy() {
  return document.querySelector('input[name="multi"]:checked').value;
}

function getOptions() {
  return document.getElementById("options-str").value.trim().toUpperCase() || "ABCD";
}

function getPerQuestion() {
  return document.getElementById("per-question").checked;
}

/* ═══════════════════════════════════════════════════════════════════
   Step 3: Key Tabs
   ═══════════════════════════════════════════════════════════════════ */
function addSetTab(letter) {
  if (!letter) {
    // Prompt
    letter = prompt("Set letter (e.g. A, B, C, D):");
    if (!letter) return;
    letter = letter.trim().toUpperCase();
    if (!letter || letter.length !== 1) { alert("Enter a single letter."); return; }
  }
  if (G.activeSets.includes(letter)) { switchTab(letter); return; }

  G.activeSets.push(letter);
  G.activeSets.sort();
  if (!G.keys[letter]) {
    G.keys[letter] = Array(G.numQ).fill("");
  }
  rebuildTabs();
  switchTab(letter);
}

function rebuildTabs() {
  const bar = document.getElementById("key-tabs-bar");
  bar.innerHTML = "";
  for (const s of G.activeSets) {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (s === G.activeTab ? " active" : "");
    btn.textContent = "Set " + s;
    btn.onclick = () => switchTab(s);
    bar.appendChild(btn);
  }
}

function switchTab(letter) {
  // Save current tab state first
  if (G.activeTab) saveTabState(G.activeTab);
  G.activeTab = letter;
  rebuildTabs();
  renderKeyGrid(letter);
}

function saveTabState(letter) {
  if (!G.numQ) return;
  const opts = getOptions();
  const key = [];
  for (let i = 1; i <= G.numQ; i++) {
    const checked = document.querySelector(`input[name="key_${letter}_q${i}"]:checked`);
    if (!checked || checked.value === "") key.push("");
    else key.push(checked.value);
  }
  G.keys[letter] = key;
}

function renderKeyGrid(letter) {
  const wrap = document.getElementById("key-tabs-content");
  const opts = getOptions();
  const key = G.keys[letter] || Array(G.numQ).fill("");

  let html = `<div class="tab-panel active">`;

  // Paste box
  html += `<div class="row" style="margin-bottom:8px">
    <label for="paste-${letter}">Paste key string:</label>
    <input type="text" id="paste-${letter}" placeholder="BC-DA..." size="40" class="mono">
    <button onclick="pasteKey('${letter}')">Apply</button>
    <span class="info" style="margin-left:8px">Letters = answer, - or space = not counted</span>
  </div>`;

  // Grid
  html += `<div class="key-grid-wrap"><table class="key-grid"><thead><tr><th>Q</th>`;
  for (const o of opts) html += `<th>${o}</th>`;
  html += `<th>–</th></tr></thead><tbody>`;

  for (let i = 0; i < G.numQ; i++) {
    const qi = i + 1;
    const cur = key[i] || "";
    html += `<tr><td><strong>q${qi}</strong></td>`;
    for (const o of opts) {
      const chk = cur === o ? " checked" : "";
      html += `<td><label><input type="radio" name="key_${letter}_q${qi}" value="${o}"${chk} onchange="updateCountedDisplay('${letter}')"></label></td>`;
    }
    const blankChk = cur === "" ? " checked" : "";
    html += `<td><label><input type="radio" name="key_${letter}_q${qi}" value=""${blankChk} onchange="updateCountedDisplay('${letter}')"></label></td>`;
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;

  // Counted display
  const counted = key.filter(k => k !== "").length;
  const mc = document.getElementById("mc").value.trim() || "4";
  const maxScore = counted * parseFloat(mc);
  html += `<p style="margin-top:6px"><strong>Counted:</strong> ${counted} / ${G.numQ}`;
  html += ` &nbsp;|&nbsp; <strong>Max score:</strong> <span id="max-score-${letter}">${maxScore}</span></p>`;

  // Warning if set present in data but no key
  html += `<div id="set-warn-${letter}"></div>`;
  html += `</div>`;
  wrap.innerHTML = html;
}

function updateCountedDisplay(letter) {
  saveTabState(letter);
  const key = G.keys[letter] || [];
  const counted = key.filter(k => k !== "").length;
  const mc = parseFloat(document.getElementById("mc").value.trim()) || 0;
  const el = document.getElementById("max-score-" + letter);
  if (el) el.textContent = (counted * mc).toString();
}

function pasteKey(letter) {
  const inp = document.getElementById("paste-" + letter);
  if (!inp) return;
  const raw = inp.value.trim().toUpperCase();
  const opts = getOptions();
  const key = [];
  for (let i = 0; i < raw.length && key.length < G.numQ; i++) {
    const ch = raw[i];
    if (ch === "-" || ch === " ") key.push("");
    else if (opts.includes(ch)) key.push(ch);
    // skip unknown chars
  }
  // Pad remaining with blank
  while (key.length < G.numQ) key.push("");
  G.keys[letter] = key;
  renderKeyGrid(letter);
}

function checkSetWarnings() {
  for (const s of G.activeSets) {
    const el = document.getElementById("set-warn-" + s);
    if (!el) continue;
    if (G.setsInData[s] !== undefined) {
      el.innerHTML = "";
    }
  }
  // Warn about data sets with no tab
  const dataSets = Object.keys(G.setsInData).filter(s => s && s.trim());
  for (const s of dataSets) {
    if (!G.activeSets.includes(s)) {
      status(`Warning: Set '${s}' found in results.csv but no key tab created.`, 5000);
    }
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Step 4: Save / Load / Score
   ═══════════════════════════════════════════════════════════════════ */
async function saveKeys() {
  if (G.activeTab) saveTabState(G.activeTab);
  const name = document.getElementById("key-name").value.trim();
  if (!name) { alert("Enter a key name."); return; }
  const data = {
    version: 1,
    questions: G.numQ,
    options: getOptions(),
    sets: G.keys,
  };
  try {
    const r = await api("POST", "/api/keys/save", { name, data });
    status("Keys saved to " + r.path, 4000);
    refreshKeyList();
  } catch (e) {
    alert("Save failed: " + e.message);
  }
}

async function loadKeys() {
  const sel = document.getElementById("key-load-list");
  const name = sel.value;
  if (!name) { alert("Select a key file to load."); return; }
  try {
    const data = await api("GET", "/api/keys/load?name=" + encodeURIComponent(name));
    G.keys = data.sets || {};
    // Ensure all sets have tabs
    for (const s of Object.keys(G.keys)) {
      if (!G.activeSets.includes(s)) {
        G.activeSets.push(s);
      }
    }
    G.activeSets.sort();
    document.getElementById("options-str").value = data.options || "ABCD";
    document.getElementById("key-name").value = name;
    rebuildTabs();
    if (G.activeSets.length) switchTab(G.activeSets[0]);
    status("Loaded key: " + name, 3000);
  } catch (e) {
    alert("Load failed: " + e.message);
  }
}

async function refreshKeyList() {
  try {
    const d = await api("GET", "/api/keys/list");
    const sel = document.getElementById("key-load-list");
    sel.innerHTML = '<option value="">— load —</option>';
    for (const k of d.keys) {
      const opt = document.createElement("option");
      opt.value = k; opt.textContent = k;
      sel.appendChild(opt);
    }
  } catch (e) { /* ignore */ }
}

function buildRequestBody() {
  if (G.activeTab) saveTabState(G.activeTab);
  return {
    scheme: getScheme(),
    multi_policy: getMultiPolicy(),
    options: getOptions(),
    per_question: getPerQuestion(),
    keys: G.keys,
    key_name: document.getElementById("key-name").value.trim() || "ui_session",
  };
}

async function doPreview() {
  const area = document.getElementById("preview-area");
  area.innerHTML = "<p>Scoring…</p>";
  try {
    const body = buildRequestBody();
    const d = await api("POST", "/api/preview", body);
    renderPreview(d, area);
  } catch (e) {
    area.innerHTML = `<p class="error">Error: ${esc(e.message)}</p>`;
  }
}

function renderPreview(d, area) {
  const s = d.summary;
  let html = `<div class="row" style="margin-bottom:8px; gap:16px">
    <span><strong>Total:</strong> ${s.total}</span>
    <span><strong>Scored:</strong> ${s.scored}</span>
    <span><strong>Flagged:</strong> ${s.flagged}</span>`;
  if (s.mean !== undefined) {
    html += `<span><strong>Mean:</strong> ${parseFloat(s.mean).toFixed(2)}</span>
             <span><strong>Min:</strong> ${s.min}</span>
             <span><strong>Max:</strong> ${s.max}</span>`;
  }
  html += `</div>`;

  if (d.preview.length) {
    const cols = ["file_id","Set","ID NO","score","max_score","correct","wrong",
                  "unattempted","multi","counted","score_status"];
    html += `<div class="preview-wrap"><table class="preview-table"><thead><tr>`;
    for (const c of cols) html += `<th>${c}</th>`;
    html += `</tr></thead><tbody>`;
    for (const row of d.preview) {
      html += "<tr>";
      for (const c of cols) {
        let v = row[c] !== undefined ? row[c] : "";
        html += `<td class="mono">${esc(String(v))}</td>`;
      }
      html += "</tr>";
    }
    html += `</tbody></table></div>`;
  }
  area.innerHTML = html;
}

async function doScore() {
  if (!confirm("Write score.csv? Any existing file will be backed up.")) return;
  const area = document.getElementById("preview-area");
  area.innerHTML = "<p>Scoring and writing…</p>";
  try {
    const body = buildRequestBody();
    const d = await api("POST", "/api/score", body);
    area.innerHTML = `<p class="badge badge-green" style="font-size:14px; padding:6px 12px">
      ✓ Wrote ${d.rows_written} rows to <span class="mono">${esc(d.path)}</span></p>
      <p class="info">Run JSON: <span class="mono">${esc(d.run_json)}</span></p>`;
    status("score.csv written.", 5000);
  } catch (e) {
    area.innerHTML = `<p class="error">Error: ${esc(e.message)}</p>`;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Utilities
   ═══════════════════════════════════════════════════════════════════ */
function esc(s) {
  const d = document.createElement("div");
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

/* ═══════════════════════════════════════════════════════════════════
   Init
   ═══════════════════════════════════════════════════════════════════ */
window.addEventListener("DOMContentLoaded", () => {
  loadSummary();
  refreshKeyList();
});
</script>
</body>
</html>
