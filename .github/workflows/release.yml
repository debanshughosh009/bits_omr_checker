# Builds OMR Checker for macOS (Apple Silicon and Intel) and Windows, checks that each
# packaged app reads scans, and attaches the installers to a draft GitHub Release.
# Starts when a v* tag is pushed (the tag must match __version__ in app/server.py);
# run it by hand from the Actions tab to build without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon
          - os: macos-15-intel  # Intel
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - run: pip install -r packaging/requirements.txt

      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('app/server.py').read()).group(1))")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but app/server.py says $v"; exit 1; }

      - name: Check scoring and the reader
        run: |
          node scripts/check_score.mjs
          python scripts/check_designer.py

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Package
        run: python packaging/build.py

      - name: Check the packaged app reads scans
        run: python packaging/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: omr-checker-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: OMR Checker ${{ github.ref_name }}
          files: release/*
          body: |
            **macOS:** download the `.dmg` for your Mac (`arm64` for Apple Silicon, `x64` for Intel), open it and drag OMR Checker to Applications. The app is not signed yet: the first time, right-click it and choose Open (on macOS 15, allow it under System Settings → Privacy & Security).
            **Windows:** run `OMR-Checker-…-windows-setup.exe`. It is not signed yet: if SmartScreen warns, choose More info → Run anyway.
            OMR Checker runs from the menu bar / notification area and opens in your browser. Scans and results stay on your computer.
